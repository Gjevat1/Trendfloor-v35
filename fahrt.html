<style>

.st{display:flex;gap:10px;padding:6px 0;border-top:1px solid #555;font-size:14px}
@media print{nav,header,.np{display:none}body{background:#fff;color:#000}.card{background:#fff;border:1px solid #999}.mu{color:#444}}
</style></head><body>
<main id="m"></main>
<nav><button data-t="heute">Heute</button><button data-t="aus">Ausgabe</button><button data-t="buch">Fahrtenbuch</button><button data-t="set">Einstellungen</button></nav>
<dialog id="d"></dialog><div id="t" style="display:none;position:fixed;left:12px;right:12px;bottom:76px;background:#b3413a;color:#fff;padding:10px 12px;border-radius:10px;z-index:50"></div>
<script>
const K='tf_fahrt_v1',D=document.querySelector('#d'),$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const Z=()=>{try{return parent!==window&&parent.TFData?parent.TFData():null}catch(e){return null}};
const kol=()=>{const z=Z();return z?[...(z.colleagues||[])]:lines(S.set.kollegen)};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S){try{const o=localStorage.getItem('ftb1');if(o){S=JSON.parse(o);localStorage.setItem(K,o)}}catch(e){}}
S=S||{};S.set=Object.assign({fahrer:(Z()&&Z().set&&Z().set.name)||'Xhevat',home:'Grundtnerstraße 1, 9500 Villach',firma:'Auenweg 35, 9500 Villach',kollegen:'',zwecke:'Baustelle\nMaterial holen\nFirma\nBesprechung\nCafé/Pause\nMontage\nSonstiges',lief:'Frischeis\nWürth\nEFR\nBauhaus\nObi'},S.set);
S.tage=S.tage||[];S.orte=S.orte||{};S.aus=S.aus||[];S.bs=S.bs||{};S.priv=S.priv||[];
if(!Object.keys(S.bs).length)S.tage.forEach(t=>t.st.forEach(s=>{if(s.typ==='Baustelle'&&s.adr){const e=S.bs[s.adr]||(S.bs[s.adr]={t:0,w:[]});e.t=Math.max(e.t,Date.parse(s.zeit));if(s.name&&!e.w.includes(s.name))e.w.push(s.name)}}));
const msg=t=>{const e=D.open?$('#e'):$('#t');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(msg.h);msg.h=setTimeout(()=>e.style.display='none',6000)};

async function addr(){const c=await gps();try{const j=await(await fetch('https://nominatim.openstreetmap.org/reverse?format=json&accept-language=de&lat='+c.latitude+'&lon='+c.longitude)).json(),a=j.address||{};
const s=[a.road,a.house_number].filter(Boolean).join(' '),o=[a.postcode,a.city||a.town||a.village||a.municipality].filter(Boolean).join(' ');return [s,o].filter(Boolean).join(', ')||j.display_name||''}catch(e){return c.latitude.toFixed(5)+', '+c.longitude.toFixed(5)}}
async function start(){const l=[...S.tage].reverse().find(t=>t.kmE);
const t={id:Date.now(),fahrer:S.set.fahrer,bf:['',''],aus:false,kmS:l?l.kmE:'',kmE:'',fertig:false,st:[{typ:'Start',zeit:new Date().toISOString(),name:'',adr:'',zweck:''}]};
S.tage.push(t);save();render();let a='';try{a=await addr()}catch(e){}t.st[0].adr=a||S.set.home;save();if(tab==='heute')render()}
const upd=(k,v)=>{cur()[k]=v;save()},bf=(i,v)=>{cur().bf[i]=v;save()},sv=(k,v)=>{S.set[k]=v;save()};
async function loc(id,b){const el=$('#'+id);b.disabled=true;b.textContent='Standort wird gesucht …';
try{const a=await addr();el.value=a;el.dispatchEvent(new Event('input'));el.dispatchEvent(new Event('change'))}
catch(e){msg(e&&e.code===1?'Standortzugriff nicht erlaubt (im Test oft blockiert). In der installierten App erlauben.':'Standort nicht verfügbar. Bitte Adresse eintippen.')}
b.disabled=false;b.textContent='📍 Standort ermitteln'}
const t0=v=>{cur().st[0].adr=v;save()};
async function station(typ){const t=cur(),z=new Date().toISOString(),zw=lines(S.set.zwecke),
def={Baustelle:'Baustelle',Material:'Material holen',Firma:'Firma',Pause:'Café/Pause',Ende:t.aus?'Montage':''}[typ],
h={Ende:'Ende / Heimfahrt',Material:'Material holen',Pause:'Café / Pause'}[typ]||typ;
D.innerHTML='<h3>'+h+'</h3><label>Name / Baustelle</label><input id="n" autocomplete="off"><div id="ol2">'+ortl('')+'</div>'+
'<label>Adresse</label><input id="a" placeholder="Adresse eintippen oder Standort ermitteln"><button class="b s" style="padding:12px;margin:0 0 10px" onclick="loc(\'a\',this)">📍 Standort ermitteln</button><label>Zweck</label><select id="z"><option></option>'+zw.map(x=>'<option'+(x===def?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'+
(typ==='Ende'?'<label>Tachostand Ende (km)</label><input id="k" type="number" inputmode="numeric">':'')+
'<div id="e" style="display:none;color:#ffb4a8;margin:4px 0"></div><div class="g"><button class="b s" id="x">Abbrechen</button><button class="b" id="ok">Speichern</button></div>';
D.showModal();let ty=false;
if(typ==='Firma'){$('#n').value='Trendfloor';$('#a').value=S.set.firma;ty=true}
$('#a').oninput=()=>ty=true;
$('#n').oninput=e=>{$('#ol2').innerHTML=ortl(e.target.value);const v=S.orte[e.target.value];if(v){$('#a').value=v;ty=true}};$('#ol2').onclick=e=>{const r=e.target.closest('.row');if(r){const k=r.dataset.k;$('#n').value=k;$('#a').value=S.orte[k];ty=true;$('#ol2').innerHTML=''}};
$('#x').onclick=()=>D.close();
if(!ty)addr().then(a=>{if(!ty&&D.open)$('#a').value=a}).catch(()=>{if(!ty&&D.open&&typ==='Ende')$('#a').value=S.set.home});
$('#ok').onclick=()=>{const n=$('#n').value.trim(),a=$('#a').value.trim();
if(typ==='Ende'){const k=+$('#k').value;if(!k){msg('Bitte Tachostand eingeben');return}if(t.kmS&&k<t.kmS){msg('Tachostand Ende ist kleiner als Start');return}t.kmE=k;t.fertig=true}
t.st.push({typ,zeit:z,name:n,adr:a,zweck:$('#z').value});if(n||a)S.orte[n||a]=a||n;
save();D.close();render()}}
function stl(t){let n=0;return t.st.map(s=>{const l=s.typ==='Start'||s.typ==='Ende'?s.typ:(++n)+'. '+s.typ;
return '<div class="st"><span>'+tstr(new Date(s.zeit))+'</span><div><b>'+l+'</b> '+esc(s.name)+'<div class="mu">'+esc(s.adr)+(s.zweck?' · '+esc(s.zweck):'')+(s.bf&&(s.bf[0]||s.bf[1])?' · mit '+s.bf.filter(Boolean).map(esc).join(', '):'')+'</div></div></div>'}).join('')}
function heute(){const t=cur();
if(!t)return '<div class="card"><p class="mu">'+dstr(new Date())+'</p><button class="b" onclick="start()" style="font-size:20px;padding:22px">▶ Start</button></div>'+pv(1)+pv(0);
const ko=[...new Set([S.set.fahrer,...kol()])].filter(Boolean),o=(v,e)=>(e?'':'<option></option>')+ko.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('');
return pv(1)+'<div class="card"><b>'+dstr(new Date(t.st[0].zeit))+'</b><br><label>Fahrer</label><select onchange="upd(\'fahrer\',this.value)">'+o(t.fahrer,1)+'</select>'+
'<div class="g"><div><label>Beifahrer 1</label><select onchange="bf(0,this.value)">'+o(t.bf[0])+'</select></div><div><label>Beifahrer 2</label><select onchange="bf(1,this.value)">'+o(t.bf[1])+'</select></div></div>'+
'<label><input type="checkbox" style="width:auto" '+(t.aus?'checked':'')+' onchange="upd(\'aus\',this.checked)"> Auswärts / Montage</label><br><br>'+
'<label>Tachostand Start (km)</label><input type="number" inputmode="numeric" value="'+t.kmS+'" onchange="upd(\'kmS\',+this.value)"><label>Startadresse</label><input id="sa" value="'+esc(t.st[0].adr)+'" onchange="t0(this.value)"><button class="b s" style="padding:12px;margin:0" onclick="loc(\'sa\',this)">📍 Standort ermitteln</button></div>'+
'<div class="g"><button class="b s" onclick="station(\'Firma\')">Firma</button><button class="b" onclick="bau()">+ Baustelle</button><button class="b s" onclick="mat()">Material holen</button><button class="b s" onclick="station(\'Pause\')">Café / Pause</button></div>'+
pv(0)+'<button class="b r" onclick="station(\'Ende\')">■ Ende (Heimfahrt)</button><div class="card">'+stl(t)+'</div>'}
const filt=()=>S.tage.filter(t=>!mon||mk(t)===mon).sort((a,b)=>a.st[0].zeit<b.st[0].zeit?-1:1);
const sd=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString(),pk=t=>S.priv.filter(p=>p.fertig&&sd(p.ts,t.st[0].zeit)).reduce((a,p)=>a+p.km,0),dk=t=>t.kmE&&t.kmS?Math.max(0,t.kmE-t.kmS-pk(t)):0;
function rows(l){const R=[['Datum','Abfahrt','Ankunft','Ausgangspunkt','Zielpunkt','km-Stand Abfahrt','km-Stand Ankunft','gefahrene km betrieblich','gefahrene km privat','getankt Liter','getankt km-Stand','Zweck der Fahrt','Fahrer','Beifahrer 1','Beifahrer 2']],pl=s=>[s.name,s.adr].filter(Boolean).join(', ');
l.forEach(t=>{const L=t.st,tk=S.aus.filter(x=>x.typ==='Tanken'&&sd(x.ts,t.st[0].zeit));for(let i=0;i<L.length-1;i++){const a=L[i],b=L[i+1],f=i===0,e=i===L.length-2&&t.fertig;
R.push([dstr(new Date(a.zeit)),tstr(new Date(a.zeit)),tstr(new Date(b.zeit)),pl(a),pl(b),f?t.kmS:'',e?t.kmE:'',e?dk(t):'','',f&&tk.length?fm(tk.reduce((s,x)=>s+x.l,0),2):'',f&&tk.length?tk[tk.length-1].km:'',b.zweck,t.fahrer,(b.bf||t.bf)[0],(b.bf||t.bf)[1]])}});
S.priv.filter(p=>p.fertig&&(!mon||mk({st:[{zeit:p.ts}]})===mon)).forEach(p=>{const a=new Date(p.ts),b=new Date(p.ts2);R.push([dstr(a),tstr(a),tstr(b),p.a1,p.a2,'','','',p.km,'','','Privatfahrt','','',''])});
return R}
const csv=l=>'\ufeff'+rows(l).map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
async function exp(){const f=new File([csv(filt())],'Fahrtenbuch'+(mon?'_'+mon:'')+'.csv',{type:'text/csv'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Fahrtenbuch'});return}catch(e){if(e.name==='AbortError')return}}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
const del=id=>{D.innerHTML='<h3>Diesen Tag löschen?</h3><p class="mu">Der Eintrag kann nicht wiederhergestellt werden.</p><div class="g"><button class="b s" id="x">Abbrechen</button><button class="b r" id="ok">Löschen</button></div>';D.showModal();$('#x').onclick=()=>D.close();$('#ok').onclick=()=>{S.tage=S.tage.filter(t=>t.id!==id);save();D.close();render()}};
let lfT='mat';
function lfm(t){if(t)lfT=t;const L=S.lf.filter(x=>x.t===lfT).sort((a,b)=>a.n.localeCompare(b.n));
D.innerHTML='<h3>Lieferanten</h3><div class="g" style="grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px">'+Object.keys(LT).map(k=>'<button class="b'+(k===lfT?'':' s')+'" style="padding:9px 2px;font-size:13px;margin:0" onclick="lfm(\''+k+'\')">'+LT[k]+'</button>').join('')+'</div>'+
(L.length?L.map(x=>'<div class="row" onclick="lfe('+x.id+')"><b>'+esc(x.n)+'</b><div class="mu">'+esc([x.a,x.tel].filter(Boolean).join(' · '))+'</div></div>').join(''):'<p class="mu">Noch keine Einträge in „'+LT[lfT]+'“.</p>')+
'<button class="b" onclick="lfe(0)">+ Neuer Lieferant</button><button class="b s" id="x">Schließen</button>';
if(!D.open)D.showModal();$('#x').onclick=()=>D.close()}
function lfe(id){const e=S.lf.find(x=>x.id===id)||{t:lfT,n:'',a:'',tel:''};
D.innerHTML='<h3>'+(id?'Lieferant bearbeiten':'Neuer Lieferant')+'</h3><label>Art</label><select id="lt">'+Object.keys(LT).map(k=>'<option value="'+k+'"'+(k===e.t?' selected':'')+'>'+LT[k]+'</option>').join('')+'</select><label>Name</label><input id="ln" autocomplete="off" value="'+esc(e.n)+'"><label>Adresse</label><input id="la" autocomplete="off" placeholder="Adresse eintippen oder Standort ermitteln" value="'+esc(e.a)+'"><button class="b s" style="padding:12px;margin:0 0 10px" onclick="loc(\'la\',this)">📍 Standort ermitteln</button><label>Telefon (optional)</label><input id="lp" type="tel" inputmode="tel" value="'+esc(e.tel)+'"><div id="e" style="display:none;color:#ffb4a8;margin:4px 0"></div><div class="g"><button class="b s" id="x">Abbrechen</button><button class="b" id="ok">Speichern</button></div>'+(id?'<button class="b r" id="dl">Lieferant löschen</button>':'');
$('#x').onclick=()=>lfm();
$('#ok').onclick=()=>{const n=$('#ln').value.trim();if(!n){msg('Bitte einen Namen eingeben');return}
const o=id?e:{id:Date.now()};o.t=$('#lt').value;o.n=n;o.a=$('#la').value.trim();o.tel=$('#lp').value.trim();if(!id)S.lf.push(o);lfT=o.t;save();lfm()};
if(id)$('#dl').onclick=()=>{D.innerHTML='<h3>Lieferant löschen?</h3><p class="mu">'+esc(e.n)+' wird aus der Liste entfernt. Bereits gespeicherte Fahrten bleiben unverändert.</p><div class="g"><button class="b s" id="x">Abbrechen</button><button class="b r" id="ok">Löschen</button></div>';$('#x').onclick=()=>lfe(id);$('#ok').onclick=()=>{S.lf=S.lf.filter(x=>x.id!==id);save();lfm()}}}
const lsel=(t,target)=>{const L=S.lf.filter(x=>x.t===t).sort((a,b)=>a.n.localeCompare(b.n));return L.length?'<select onchange="if(this.value){$(\'#'+target+'\').value=this.value;this.selectedIndex=0}"><option value="">▾ aus Lieferanten wählen</option>'+L.map(x=>'<option value="'+esc(x.n)+'">'+esc(x.n)+(x.a?' · '+esc(x.a):'')+'</option>').join('')+'</select>':''};
const lief=()=>S.lf.filter(x=>x.t==='mat').sort((a,b)=>a.n.localeCompare(b.n)).map(x=>({id:x.id,n:x.n,a:x.a}));
const pjl=q=>{const z=Z();if(!z)return'';const last={};(z.entries||[]).forEach(e=>{if(e.projectId&&(!last[e.projectId]||e.date>last[e.projectId]))last[e.projectId]=e.date});q=(q||'').toLowerCase();
const k=(z.projects||[]).filter(p=>!p.done&&!p.kind&&(!q||[p.name,p.client,p.addr,p.nr].join(' ').toLowerCase().includes(q))).sort((a,b)=>(last[b.id]||'').localeCompare(last[a.id]||'')).slice(0,5);
return k.length?'<label>Projekte aus der Zeiterfassung</label>'+k.map(p=>'<div class="row" data-p="'+p.id+'"><b>'+esc(p.addr||p.name)+'</b><div class="mu">'+esc([p.client,p.addr?p.name:'',p.nr].filter(Boolean).join(' · '))+'</div></div>').join(''):''};
const pjall=()=>{const z=Z();if(!z)return[];const last={};(z.entries||[]).forEach(e=>{if(e.projectId&&(!last[e.projectId]||e.date>last[e.projectId]))last[e.projectId]=e.date});return(z.projects||[]).filter(p=>!p.done&&!p.kind).sort((a,b)=>(last[b.id]||'').localeCompare(last[a.id]||''))};
const pjs=()=>{const l=pjall();return l.length?'<label>Projekt aus der Zeiterfassung</label><select id="pp"><option value="">– Projekt wählen –</option>'+l.map(p=>'<option value="'+p.id+'">'+esc([p.client,p.addr||p.name].filter(Boolean).join(' · ')||p.name)+'</option>').join('')+'</select>':''};
const bsl=q=>{const k=Object.keys(S.bs).filter(x=>x.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>S.bs[b].t-S.bs[a].t).slice(0,4);return k.length?'<label>'+(q?'Passende Adressen':'Zuletzt verwendet')+'</label>'+k.map(x=>'<div class="row" data-k="'+esc(x)+'"><b>'+esc(x)+'</b><div class="mu">'+S.bs[x].w.slice(0,4).map(esc).join(', ')+'</div></div>').join(''):''};
const clean=()=>conf('Adressen ohne Besuch seit 12 Monaten aus den Vorschlägen entfernen? Das Fahrtenbuch bleibt unverändert.',()=>{const l=Date.now()-365*864e5;Object.keys(S.bs).forEach(k=>{if(S.bs[k].t<l)delete S.bs[k]})});

async function expT(){const R=[['Datum','Uhrzeit','Tankstelle','km-Stand','Liter','Literpreis EUR','Gesamtbetrag EUR','Zusätzliche Einkäufe','Summe Einkäufe EUR']];[...S.aus].filter(x=>x.typ==='Tanken').sort((a,b)=>a.ts<b.ts?-1:1).forEach(x=>{const d=new Date(x.ts);R.push([dstr(d),tstr(d),x.ort,x.km,fm(x.l,2),fm(x.lp,3),fm(x.ges,2),(x.ex||[]).map(y=>y.b+' '+fm(y.s,2)).join(', '),fm((x.ex||[]).reduce((a,y)=>a+y.s,0),2)])});
